<section class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <div mat-card-avatar class="brand-avatar">M</div>
      <mat-card-title>Welcome back</mat-card-title>
      <mat-card-subtitle>Sign in to Money-ger private banking</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form #f="ngForm" (ngSubmit)="submit(f)" class="auth-form">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput name="username" [(ngModel)]="username" required />
          <mat-icon matSuffix>person</mat-icon>
          <mat-error>Username is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" name="password" [(ngModel)]="password" required />
          <mat-icon matSuffix>lock</mat-icon>
          <mat-error>Password is required</mat-error>
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="f.invalid || loading">
          @if (loading) {
            <mat-spinner diameter="18"></mat-spinner>
          }
          {{ loading ? 'Signing in' : 'Sign in' }}
        </button>
        <a mat-button routerLink="/signup">Create an account</a>
        @if (errorMsg) {
          <p class="error-msg">{{ errorMsg }}</p>
        }
      </form>
    </mat-card-content>
  </mat-card>
</section>
